<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canada Trip 2026</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
</head>
<body>

      </svg>
    </div>
    <div class="hero-inner">
      <p class="eyebrow">
        <svg class="leaf" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c.3 1.6.9 2.9 1.8 4 .3-.9.9-1.7 1.7-2.4-.1 1.2 0 2.3.4 3.3 1-.4 2-.6 3.1-.6-.8.8-1.3 1.7-1.6 2.7 1.1.1 2.2.5 3.1 1.1-1.1.4-2 1-2.7 1.8 1 .5 1.8 1.2 2.5 2.1-1.2 0-2.3.2-3.3.7.6.9 1 1.9 1.2 3-1-.6-2.1-.9-3.2-1 .1 1.1 0 2.2-.4 3.3-.6-.9-1.4-1.7-2.3-2.2-.1 1-.1 2.1.1 3.2-.8-.8-1.4-1.7-1.8-2.7L12 22l-.7-3.7c-.4 1-1 1.9-1.8 2.7.2-1.1.2-2.2.1-3.2-.9.5-1.7 1.3-2.3 2.2-.4-1.1-.5-2.2-.4-3.3-1.1.1-2.2.4-3.2 1 .2-1.1.6-2.1 1.2-3-1-.5-2.1-.7-3.3-.7.7-.9 1.5-1.6 2.5-2.1-.7-.8-1.6-1.4-2.7-1.8.9-.6 2-1 3.1-1.1-.3-1-.8-1.9-1.6-2.7 1.1 0 2.1.2 3.1.6.4-1 .5-2.1.4-3.3.8.7 1.4 1.5 1.7 2.4.9-1.1 1.5-2.4 1.8-4z"/></svg>
        Canada Trip Planner
      </p>
      <h1 id="trip-title">Canada Trip 2026</h1>
      <p id="trip-route" class="route"></p>
      <p id="trip-dates" class="dates"></p>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="itinerary">Itinerary</button>
    <button class="tab-btn" data-tab="documents">Documents</button>
    <button class="tab-btn" data-tab="map">Map</button>
  </nav>

  <main>
    <section id="itinerary" class="tab-panel active">
      <div id="day-list" class="day-list"></div>
    </section>

    <section id="documents" class="tab-panel">
      <div class="doc-group">
        <h2>✈️ Flights</h2>
        <div id="flights-list" class="card-grid"></div>
      </div>
      <div class="doc-group">
        <h2>🚆 Trains</h2>
        <div id="trains-list" class="card-grid"></div>
      </div>
      <div class="doc-group">
        <h2>🏨 Accommodation</h2>
        <div id="accommodations-list" class="card-grid"></div>
      </div>
      <div class="doc-group">
        <h2>🛂 Travel authorization</h2>
        <div id="travel-auth-list" class="card-grid"></div>
      </div>
    </section>

    <section id="map" class="tab-panel">
      <div id="trip-map"></div>
      <div id="places-list" class="card-grid places-list"></div>
    </section>
  </main>

  <footer>
    <p>Edit this trip anytime by updating <code>data.json</code> on GitHub — changes go live automatically.</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
